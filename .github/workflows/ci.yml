# ==============================================================================
# Continuous Integration Pipeline
# ==============================================================================
# Runs on every push and pull request to ensure code quality and functionality
#
# Jobs:
#   - lint: Code style and formatting checks
#   - security: Security vulnerability scanning
#   - test: Unit and integration tests with coverage
#   - build: Docker image build verification
# ==============================================================================

name: CI

on:
  push:
    branches: [main, develop, modular]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ==============================================================================
  # Lint Job - Code Quality Checks
  # ==============================================================================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install uv
        run: pip install uv
      
      - name: Install dependencies
        run: uv sync --extra dev
      
      - name: Run ruff (linting)
        run: uv run ruff check src/ tests/
        continue-on-error: true
      
      - name: Run black (formatting check)
        run: uv run black --check src/ tests/
        continue-on-error: true
      
      - name: Run isort (import sorting)
        run: uv run isort --check-only src/ tests/
        continue-on-error: true
  
  # ==============================================================================
  # Security Job - Vulnerability Scanning
  # ==============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install uv
        run: pip install uv
      
      - name: Install dependencies
        run: uv sync --extra dev
      
      - name: Run bandit (security linting)
        run: uv run bandit -r src/ -f json -o bandit-report.json
        continue-on-error: true
      
      - name: Run safety (dependency vulnerabilities)
        run: uv run safety check --json
        continue-on-error: true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
  
  # ==============================================================================
  # Test Job - Unit & Integration Tests
  # ==============================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install uv
        run: pip install uv
      
      - name: Install dependencies
        run: uv sync --extra dev
      
      - name: Create test .env file
        run: |
          cat > .env << EOF
          SERP_API_KEY=test_key_for_ci_testing
          AWS_REGION=us-east-1
          BEDROCK_MODEL_ID=test-model
          ENVIRONMENT=testing
          EOF
      
      - name: Run unit tests with coverage
        run: uv run pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=html --cov-report=term
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
  
  # ==============================================================================
  # Build Job - Docker Image Verification
  # ==============================================================================
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          push: false
          tags: cfl-player-id:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker image
        run: |
          docker images
          echo "✓ Docker image built successfully"
  
  # ==============================================================================
  # Summary Job - Aggregate Results
  # ==============================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, security, test, build]
    if: always()
    
    steps:
      - name: Check CI status
        run: |
          echo "CI Pipeline Results:"
          echo "  Lint: ${{ needs.lint.result }}"
          echo "  Security: ${{ needs.security.result }}"
          echo "  Tests: ${{ needs.test.result }}"
          echo "  Build: ${{ needs.build.result }}"
          
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Tests failed"
            exit 1
          fi
          
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Docker build failed"
            exit 1
          fi
          
          echo "✅ CI Pipeline passed"
