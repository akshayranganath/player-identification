[project]
name = "player-identification"
version = "0.1.0"
description = "AI-powered CFL player identification system using computer vision and web search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core framework
    "strands-agents>=1.19.0",
    "strands-agents-tools>=0.2.17",
    
    # Configuration & validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    
    # HTTP & Web
    "requests>=2.31.0",
    "google-search-results>=2.4.2",
    
    # UI
    "streamlit>=1.52.1",
    "pandas>=2.3.3",
    
    # Optional dependencies (from original)
    "beautifulsoup4>=4.12.0",
    "selenium>=4.15.0",
    "webdriver-manager>=4.0.0",
    "lxml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "httpx>=0.24.0",
    "faker>=19.0.0",
    
    # Code quality
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.7.0",
    "isort>=5.12.0",
    
    # Security scanning
    "bandit>=1.7.5",
    "safety>=2.3.5",
]

resilience = [
    # Retry & circuit breaker (optional for production)
    "tenacity>=8.2.0",
]

monitoring = [
    # Structured logging & monitoring (optional for production)
    "structlog>=23.1.0",
    "sentry-sdk>=1.35.0",
]

performance = [
    # Performance optimizations (optional)
    "redis>=5.0.0",
    "aiofiles>=23.2.0",
    "httpx>=0.24.0",
]

all = [
    "player-identification[dev,resilience,monitoring,performance]",
]
